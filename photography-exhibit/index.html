<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Exhibit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-800">
  <main class="text-center text-white px-4 pt-8">
    <h1 class="text-4xl mb-8">Photography Exhibit</h1>

    <div class="main-container grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="card rounded-lg p-4 border-2 flex flex-col">
        <img
        src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg"
        alt="colosseo"
        class="rounded-md"
        />
        <h3 class="subheading font-bold text-2xl">Colosseum</h3>
        <p class="description text-base">There is so much history and beauty. The light hits it just right. </p>
      </div>
      <div class="card rounded-lg p-4 border-2">
        <img
      src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="alps"
      class="rounded-md"
      />
        <h3 class="subheading font-bold text-2xl">The Alps</h3>
        <p class="description text-base">The mountains go on forever and the view is breathtaking. </p>
      </div>
      <div class="card rounded-lg p-4 border-2">
        <img
        src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg"
        alt="sea"
        class="rounded-md"
         />
        <h3 class="subheading font-bold text-2xl">Sea</h3>
        <p class="description text-base">The water was still, the air was cool and the feeling is pure peace. </p>
      </div>
    </div>
  </main>
</body>

</html>
